spring:
    application:
        name: minierp

    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/minierp}
        username: ${DB_USER:user}
        password: ${DB_PASSWORD:password}

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                format_sql: true

    flyway:
        enabled: true
        locations: classpath:db/migration

springdoc:
    swagger-ui:
        path: /swagger-ui.html

logging:
    level:
        org.hibernate.SQL: debug
        org.flywaydb: debug