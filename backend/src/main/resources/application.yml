spring:
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/minierp}
        username: ${DB_USER:minierp}
        password: ${DB_PASSWORD:minierp}
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
             hibernate:
                 format_sql: true
    flyway:
        enabled: true
        locations: classpath:db.migration
springdoc:
    swagger-ui:
        path: /swagger-ui.html

logging:
    level:
        org.hibernate.SQL: debug
